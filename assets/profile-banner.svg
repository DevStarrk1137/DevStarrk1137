    <path d="M18 213C57 190 89 181 116 181C143 181 175 190 214 213" stroke="#71717a" stroke-width="2"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="389" y="129" fill="#71717a" font-size="17">[michael@archlinux ~]$</text>
    <text x="613" y="129" fill="#f4f4f5" font-size="17">fastfetch --logo arch</text>

    <text x="389" y="181" fill="#f4f4f5" font-size="28" font-weight="700">Michael Alexandre</text>
    <path d="M389 196H676" stroke="#52525b"/>

    <g font-size="17">
      <text x="389" y="229" fill="#e4e4e7" font-weight="700">Role</text>
      <text x="486" y="229" fill="#a1a1aa">Backend Developer</text>

      <text x="389" y="262" fill="#e4e4e7" font-weight="700">Stack</text>
      <text x="486" y="262" fill="#a1a1aa">Java · Go · Python</text>

      <text x="389" y="295" fill="#e4e4e7" font-weight="700">Focus</text>
      <text x="486" y="295" fill="#a1a1aa">reliable systems · cloud · APIs</text>

      <text x="389" y="328" fill="#71717a">[michael@archlinux ~]$</text>
      <rect x="613" y="310" width="10" height="21" fill="#e4e4e7"/>
