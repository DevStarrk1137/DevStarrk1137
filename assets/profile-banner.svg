<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Michael Alexandre — terminal Arch Linux</title>
  <desc id="desc">Terminal monocromático inspirado no Arch Linux apresentando Michael Alexandre como desenvolvedor backend.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <radialGradient id="light" cx="78%" cy="0" r="80%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="18" fill="#050505"/>
  <rect x="42" y="34" width="1116" height="332" rx="11" fill="url(#background)" stroke="#3f3f46" stroke-width="2" filter="url(#shadow)"/>
  <rect x="42" y="34" width="1116" height="332" rx="11" fill="url(#light)"/>

  <path d="M42 83H1158" stroke="#3f3f46"/>
  <circle cx="68" cy="59" r="6" fill="#52525b"/>
  <circle cx="89" cy="59" r="6" fill="#71717a"/>
  <circle cx="110" cy="59" r="6" fill="#e4e4e7"/>
  <text x="600" y="64" text-anchor="middle" fill="#71717a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">michael@archlinux: ~</text>

  <g transform="translate(105 118)" fill="none" stroke-linejoin="round">
    <path d="M116 0L18 213L66 184L116 74L166 184L214 213Z" fill="#e4e4e7" opacity=".96"/>
